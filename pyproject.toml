[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarsim"
version = "2.0.0"
description = "LunarSim: a verified discrete-event testbed for lunar surface cargo logistics and dispatch marketplaces"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Azizjon Rahimov" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
full = ["scipy>=1.10", "matplotlib>=3.7", "pymupdf>=1.24", "pytest>=7"]
terrain = ["rasterio>=1.4", "pillow>=10"]
ml = ["stable-baselines3>=2.9", "gymnasium[box2d]>=1.4", "torch>=2.8", "tensorboard>=2.17"]  # torch: --index-url https://download.pytorch.org/whl/cpu for the lander MLP
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "authlib>=1.3", "sse-starlette>=2.1", "httpx>=0.27", "python-multipart>=0.0.9", "argon2-cffi>=23.1"]

[project.scripts]
lunarsim = "lunarsim.cli:main"

[tool.setuptools]
packages = ["lunarsim"]

[tool.setuptools.package-data]
lunarsim = ["schemas/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://azizjonrahimov.github.io/lunar-logistics-research/"
Repository = "https://github.com/azizjonrahimov/lunar-logistics-research"
Paper = "https://github.com/azizjonrahimov/lunar-logistics-research/blob/main/paper/lunar_logistics_marketplace_paper_v2.pdf"
