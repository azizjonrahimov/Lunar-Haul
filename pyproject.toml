[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunarsim"
version = "3.0.0"
description = "LunarHaul (formerly LunarSim): a verified discrete-event testbed for lunar surface cargo logistics, dispatch marketplaces, and learned landing and driving models on real terrain"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Azizjon Rahimov" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0"]

[project.optional-dependencies]
full = ["scipy>=1.10", "matplotlib>=3.7", "pymupdf>=1.24", "pytest>=7"]
terrain = ["rasterio>=1.4", "pillow>=10"]
comms = ["spiceypy>=6.0", "rasterio>=1.4"]  # R-1 Earth-link pipeline (tools/comms/): SPICE ephemeris + windowed LOLA DEM reads
ml = ["stable-baselines3>=2.9", "gymnasium[box2d]>=1.4", "torch>=2.8", "tensorboard>=2.17", "onnx>=1.17", "onnxruntime>=1.20"]  # torch: --index-url https://download.pytorch.org/whl/cpu for the lander MLP
service = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "authlib>=1.3", "sse-starlette>=2.1", "httpx>=0.27", "python-multipart>=0.0.9", "argon2-cffi>=23.1"]

[project.scripts]
lunarsim = "lunarsim.cli:main"

[tool.setuptools]
packages = ["lunarsim"]

[tool.setuptools.package-data]
lunarsim = ["schemas/*.json", "catalog-v1.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.urls]
Homepage = "https://azizjonrahimov.github.io/Lunar-Haul/"
Repository = "https://github.com/azizjonrahimov/Lunar-Haul"
Paper = "https://github.com/azizjonrahimov/Lunar-Haul/blob/main/paper/lunar_logistics_marketplace_paper_v2.pdf"
