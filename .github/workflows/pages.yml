name: deploy simulator

on:
  push:
    branches: [main]
    paths: ["web/**", "site/**", "data/sample_traces/**", "data/terrain/connecting_ridge/**", "data/policies/**", "data/driving/**", "results/E1_phases.csv", "results/table_main.csv", "results/table_E15.csv", "results/table_E16.csv", "results/table_E20.csv", "results/E20_fit.json", "figures/fig2*", "figures/phase3_captions.json", "figures/v3_fig02_pipeline.*", "tests/fixtures/lander_parity.json", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # base_path is "/<repository name>" for a project site (renames are not redirected), "" on a custom domain
      - id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install numpy pandas
      - uses: actions/setup-node@v4
        with: { node-version: "24", cache: npm, cache-dependency-path: site/package-lock.json }
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
        env: { SITE_BASE: "${{ steps.pages.outputs.base_path }}/", PYTHON: python }
      - name: Published runs (run-* releases from the run queue, B-37) into the site
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          mkdir -p site/dist/runs
          for tag in $(gh release list --limit 200 --json tagName --jq '.[].tagName | select(startswith("run-"))'); do
            d="site/dist/runs/${tag#run-}"; mkdir -p "$d"
            gh release download "$tag" --dir "$d" --pattern 'summary.json' --pattern 'trace_seed0.json.gz' --pattern 'scene.tar.gz'
            if [ -f "$d/scene.tar.gz" ]; then tar -xzf "$d/scene.tar.gz" -C "$d" && rm "$d/scene.tar.gz"; fi
          done
      - uses: actions/upload-pages-artifact@v3
        with: { path: site/dist }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
