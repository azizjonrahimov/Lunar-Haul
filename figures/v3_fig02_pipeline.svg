>interventions</text></g><g class="pn l0 dual"><rect x="802" y="34" width="140" height="324" rx="5"/><text class="pt" x="810" y="54">Logistics engine</text><text class="pd" x="810" y="71">discrete-event, four</text><text class="pd" x="810" y="85.5">dispatch rules;</text><text class="pd" x="810" y="100">samples a landing</text><text class="pd" x="810" y="114.5">outcome at every</text><text class="pd" x="810" y="129">landing and a driving</text><text class="pd" x="810" y="143.5">draw on every trip</text></g><g class="pn l0"><rect x="964" y="58.5" width="108" height="59" rx="5"/><text class="pt" x="972" y="78.5">Metrics</text><text class="pd" x="972" y="95.5">delay, cost per</text><text class="pd" x="972" y="110">kg, trace v2</text></g><g class="pn l0"><rect x="964" y="163.25" width="108" height="73.5" rx="5"/><text class="pt" x="972" y="183.25">Experiments</text><text class="pd" x="972" y="200.25">E15–E20, seeded,</text><text class="pd" x="972" y="214.75">with 95 %</text><text class="pd" x="972" y="229.25">intervals</text></g><g class="pn l0"><rect x="964" y="268" width="108" height="88" rx="5"/><text class="pt" x="972" y="288">Fitted law</text><text class="pd" x="972" y="305">delivery cost vs</text><text class="pd" x="972" y="319.5">dispersion,</text><text class="pd" x="972" y="334">standoff and</text><text class="pd" x="972" y="348.5">autonomy</text></g><g class="plg"><rect class="dual-key" x="282" y="381" width="26" height="14" rx="3"/><text class="pd" x="316" y="392">Python ⇄ browser, one physics: dashed boxes run in both from the same files and are cross-checked on the Verification page. Blue:</text><text class="pd" x="316" y="406.5">landing · green: driving · red: plume.</text></g></svg>
